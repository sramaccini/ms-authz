openapi: 3.1.0
info:
  title: ms-authz - API di amministrazione RBAC
  version: 1.0.0
  description: |
    API per l'interfaccia di amministrazione della SPA, esposte dal BFF (stessa origine della SPA).

    **Autenticazione**: cookie `SESSION_ID` impostato dal BFF al login (nessun token nel JavaScript).
    Le richieste non idempotenti (POST, PUT, PATCH, DELETE) devono avere un header `Origin` ammesso
    (`bff.frontend.allowed-origins`): il browser lo invia da solo con `fetch`.

    **Ambiti**
    - `rbac:manage` (ruolo `TENANT_ADMIN`): amministratore delegato, opera solo sul tenant della propria sessione.
    - `rbac:manage-global` (ruolo `GLOBAL_ADMIN`): tutti i tenant; in esclusiva definisce ruoli, crea tenant,
      attiva/disattiva utenti.
    - `session:revoke` / `session:revoke-global`: revoca delle sessioni, nel proprio tenant o ovunque.

    **Regole**
    - Il catalogo dei permessi e i ruoli di sistema (`system: true`) si modificano solo con le migrazioni del
      database (sviluppatori).
    - I permessi `*-global` esistono solo nel ruolo di sistema `GLOBAL_ADMIN`; un amministratore delegato non
      puo' assegnare ne' togliere ruoli che li contengono.
    - Nessuno puo' modificare le proprie assegnazioni o disattivare se stesso.
    - Le modifiche hanno effetto **al login successivo** degli utenti coinvolti. Per un effetto immediato,
      revocare le sessioni con `DELETE /bff/admin/users/{username}/sessions` (l'utente rientra con SSO).
    - Ogni modifica e' registrata nell'audit.

    **Errori**: `application/problem+json` (RFC 9457); `type` = `urn:problem:auth-service:<codice>`.
servers:
  - url: http://localhost:8080
    description: BFF locale
security:
  - sessionCookie: []
tags:
  - name: Catalogo
  - name: Ruoli
  - name: Tenant
  - name: Utenti
  - name: Audit
  - name: Sessioni

paths:
  /api/v1/admin/permissions:
    get:
      tags: [Catalogo]
      summary: Catalogo dei permessi (sola lettura)
      responses:
        '200':
          description: Permessi
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/roles:
    get:
      tags: [Ruoli]
      summary: Ruoli con i relativi permessi
      responses:
        '200':
          description: Ruoli
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Role' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Ruoli]
      summary: Crea un ruolo (solo amministratore globale)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCreate' }
      responses:
        '201':
          description: Ruolo creato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/roles/{code}:
    parameters:
      - $ref: '#/components/parameters/RoleCode'
    put:
      tags: [Ruoli]
      summary: Sostituisce descrizione e permessi (solo amministratore globale, ruoli non di sistema)
      description: 'Blocco ottimistico: inviare la `version` letta. Se nel frattempo il ruolo e'' cambiato -> 409 `version-mismatch`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleUpdate' }
      responses:
        '200':
          description: Ruolo aggiornato (version incrementata)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Ruoli]
      summary: Elimina un ruolo non assegnato (solo amministratore globale, ruoli non di sistema)
      responses:
        '204': { description: Ruolo eliminato }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/tenants:
    get:
      tags: [Tenant]
      summary: Tenant gestibili (il proprio per l'amministratore delegato, tutti per il globale)
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Tenant' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tenant]
      summary: Crea un tenant (solo amministratore globale)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Tenant' }
      responses:
        '201':
          description: Tenant creato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/tenants/{tenant}/users:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [Tenant]
      summary: Utenti con almeno un ruolo sul tenant, ordinati per username
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Utenti del tenant con i ruoli su quel tenant
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TenantUser' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/tenants/{tenant}/users/{username}/roles:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Username'
    put:
      tags: [Utenti]
      summary: Sostituisce i ruoli dell'utente sul tenant (lista vuota = nessun ruolo)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAssignment' }
      responses:
        '200':
          description: Utente con le assegnazioni visibili all'amministratore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users:
    post:
      tags: [Utenti]
      summary: Censisce un utente gia' presente nello IAM (poi gli si assegnano i ruoli)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Utente creato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/users/{username}:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [Utenti]
      summary: Utente con le assegnazioni visibili all'amministratore
      responses:
        '200':
          description: Utente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Utenti]
      summary: Attiva/disattiva o cambia email (solo amministratore globale; non su se stessi)
      description: Un utente disattivato non puo' piu' accedere dal login successivo; per escluderlo subito revocarne le sessioni.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Utente aggiornato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/audit:
    get:
      tags: [Audit]
      summary: Registro delle modifiche, piu' recenti prima
      description: L'amministratore delegato vede solo il proprio tenant; il globale tutto, o un tenant con `tenant`.
      parameters:
        - name: tenant
          in: query
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,50}$' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Voci di audit
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }

  /bff/admin/users/{username}/sessions:
    parameters:
      - $ref: '#/components/parameters/Username'
    delete:
      tags: [Sessioni]
      summary: Revoca immediata delle sessioni dell'utente
      description: |
        Con `session:revoke` solo le sessioni aperte sul tenant dell'amministratore; con `session:revoke-global`
        tutte. I servizi di dominio smettono di accettarle entro il TTL della loro cache locale (5 s).
      responses:
        '200':
          description: Esito
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  tenant_id: { type: [string, 'null'], description: null = revoca globale }
                  revoked_sessions: { type: integer }
        '400': { description: Username non valido }
        '401': { description: Sessione assente o scaduta }
        '403': { description: Permesso mancante o Origin non ammessa }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION_ID

  parameters:
    RoleCode:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,99}$' }
    Tenant:
      name: tenant
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,50}$' }
    Username:
      name: username
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9._@-]{1,150}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0, minimum: 0 }

  responses:
    BadRequest:
      description: Richiesta non valida (es. `unknown-role`, `unknown-permission`, `global-permission`)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Sessione assente, scaduta o revocata
    Forbidden:
      description: Fuori ambito (`tenant-out-of-scope`, `global-admin-required`, `global-role`, `self-modification`, `system-role`) o Origin non ammessa
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Risorsa inesistente
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Conflitto (`version-mismatch`, `role-exists`, `role-assigned`, `tenant-exists`, `user-exists`)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, example: 'urn:problem:auth-service:tenant-out-of-scope' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Permission:
      type: object
      properties:
        code: { type: string, example: 'patient:read' }
        description: { type: string }
    Role:
      type: object
      properties:
        code: { type: string, example: DOCTOR }
        description: { type: string }
        system: { type: boolean, description: Ruolo definito dalle migrazioni, non modificabile }
        version: { type: integer, description: Da reinviare nella PUT (blocco ottimistico) }
        permissions: { type: array, items: { type: string } }
    RoleCreate:
      type: object
      required: [code, permissions]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,99}$' }
        description: { type: string, maxLength: 255 }
        permissions: { type: array, maxItems: 200, items: { type: string } }
    RoleUpdate:
      type: object
      required: [permissions, version]
      properties:
        description: { type: string, maxLength: 255 }
        permissions: { type: array, maxItems: 200, items: { type: string } }
        version: { type: integer, minimum: 0 }
    Tenant:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,50}$' }
        description: { type: string, maxLength: 255 }
    TenantUser:
      type: object
      properties:
        username: { type: string }
        email: { type: string }
        active: { type: boolean }
        roles: { type: array, items: { type: string } }
    User:
      type: object
      properties:
        username: { type: string }
        email: { type: string }
        active: { type: boolean }
        assignments:
          type: object
          description: tenant -> ruoli (solo i tenant gestibili dall'amministratore)
          additionalProperties: { type: array, items: { type: string } }
    UserCreate:
      type: object
      required: [username]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9._@-]{1,150}$' }
        email: { type: string, format: email }
    UserUpdate:
      type: object
      properties:
        active: { type: boolean }
        email: { type: string, format: email }
    RoleAssignment:
      type: object
      required: [roles]
      properties:
        roles: { type: array, maxItems: 50, items: { type: string } }
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        occurred_at: { type: string, format: date-time }
        actor: { type: string }
        actor_tenant: { type: string }
        action: { type: string, enum: [ROLE_CREATED, ROLE_UPDATED, ROLE_DELETED, TENANT_CREATED, USER_CREATED, USER_UPDATED, USER_ROLES_REPLACED] }
        target_type: { type: string, enum: [ROLE, TENANT, USER] }
        target: { type: string }
        tenant_id: { type: [string, 'null'] }
        before_state: { type: [object, 'null'] }
        after_state: { type: [object, 'null'] }
