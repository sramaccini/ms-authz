# Infrastruttura locale di sviluppo (NON per produzione)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--http-port=8180", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Sostituiti nei placeholder di keycloak/import/enterprise-realm.json (valori da .env, vedi .env.example)
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?impostare BFF_CLIENT_SECRET in .env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?impostare DEMO_USER_PASSWORD in .env}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8180:8180"

volumes:
  pgdata:
