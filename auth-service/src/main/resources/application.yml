server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true # Virtual Threads (Java 21+): Tomcat e JDBC girano su thread virtuali
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USER:auth_user}
    password: ${AUTH_DB_PASSWORD} # nessun default: va fornita da env/secret manager
    hikari:
      maximum-pool-size: ${AUTH_DB_POOL_SIZE:20} # con i virtual threads il limite reale e' il pool DB
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Session store del BFF, in sola lettura: autentica l'API di amministrazione (X-Session-ID)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IAM_ISSUER_URI:http://localhost:8180/realms/enterprise}
          # Solo token emessi PER questo servizio (claim aud): lo IAM la aggiunge con un audience mapper sul
          # client (bff-gateway e gli eventuali client di servizio). Un ID token (aud = client id) viene rifiutato.
          audiences: ${AUTH_JWT_AUDIENCE:auth-service}

# Definizione OpenAPI generata dal codice (GET /v3/api-docs): disattivata per default, attiva nel profilo dev
springdoc:
  api-docs:
    enabled: ${OPENAPI_DOCS_ENABLED:false}
  paths-to-match: /api/v1/admin/**

auth:
  openapi:
    # Le chiamate della SPA passano dal BFF: e' questo il server da indicare nella definizione
    server-url: ${OPENAPI_SERVER_URL:http://localhost:8080}
  enrich:
    # Claim del JWT che contiene lo username dell'utente
    username-claim: preferred_username
    # Authority che abilita un client di servizio ad arricchire qualunque username
    # (scope OAuth2 "auth:enrich" -> authority "SCOPE_auth:enrich")
    service-authority: SCOPE_auth:enrich

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.enterprise.auth: INFO
