server:
  port: 8080
  shutdown: graceful
  reactive:
    session:
      cookie:
        name: BFF_LOGIN
        http-only: true
        secure: true
        # Lax e non Strict: il ritorno dallo IAM e' una navigazione cross-site e il cookie deve arrivare
        same-site: lax

spring:
  application:
    name: bff-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
  # WebSession su Redis, usata SOLO durante il login OIDC (state/nonce/PKCE e tenant scelto):
  # il callback dello IAM puo' arrivare a qualunque istanza del BFF. Viene invalidata a fine login.
  session:
    timeout: ${BFF_LOGIN_SESSION_TIMEOUT:10m}
    data:
      redis:
        namespace: "bff:login" # chiavi bff:login:sessions:<id>, separate dal contratto session:<id>
        repository-type: default # scadenza via TTL, nessun keyspace event richiesto a Redis
  security:
    oauth2:
      client:
        registration:
          iam:
            provider: iam
            client-id: ${IAM_CLIENT_ID:bff-gateway}
            client-secret: ${IAM_CLIENT_SECRET} # nessun default: va fornito da env/secret manager
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          iam:
            issuer-uri: ${IAM_ISSUER_URI:http://localhost:8180/realms/enterprise}
            user-name-attribute: preferred_username
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # Servizio a valle irraggiungibile -> 503 rapido (DownstreamErrorGlobalFilter) invece di attendere il default
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
          routes:
            # Esempio di microservizio di dominio a valle
            - id: clinical-service
              uri: ${CLINICAL_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/clinical/**
            # Amministrazione RBAC (auth-service), autenticata a valle con X-Session-ID.
            # /api/v1/auth/enrich NON e' esposto: lo chiama solo il BFF durante il login.
            - id: auth-service-admin
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/**
          # Il SessionRelayGlobalFilter si applica a TUTTE le rotte: nessuna rotta e' pubblica per errore

bff:
  oidc:
    registration-id: iam
    username-claim: preferred_username
  session:
    cookie-name: SESSION_ID
    cookie-domain: ${BFF_COOKIE_DOMAIN:} # vuoto = cookie host-only (scelta piu' restrittiva)
    cookie-secure: true
    ttl: 30m
    redis-key-prefix: "session:"
  frontend:
    login-success-url: ${FRONTEND_URL:http://localhost:4200}/
    login-failure-url: ${FRONTEND_URL:http://localhost:4200}/login-error
    # Destinazione dopo il logout sullo IAM: deve essere tra i "post logout redirect URI" del client
    post-logout-url: ${FRONTEND_URL:http://localhost:4200}/
    # Origini ammesse per le richieste non idempotenti (difesa CSRF aggiuntiva a SameSite=Strict)
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:4200}
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    timeout: 3s
  # Limite per IP su /bff/login, /oauth2/authorization/**, /login/oauth2/code/** (contatore condiviso su Redis).
  # Dietro un load balancer l'IP e' quello del proxy, a meno di server.forward-headers-strategy con proxy fidato.
  login-rate-limit:
    enabled: ${BFF_LOGIN_RATE_LIMIT_ENABLED:true}
    max-requests: ${BFF_LOGIN_RATE_LIMIT_MAX:20}
    window: ${BFF_LOGIN_RATE_LIMIT_WINDOW:1m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
